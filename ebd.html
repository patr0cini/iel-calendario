<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>EBD – Calendário de Lições</title>
<style>
  :root{
    --bg:#f7f5f0; --card:#fff; --ink:#22252a; --muted:#6b6f76; --line:#e4e0d6;
    --teal:#00acc1; --pink:#f4627a; --yellow:#fcdc00;
    --accent:#00838f; --accent-soft:#e0f5f8; --meet:#fff8cc; --event:#fde8ec; --event-ink:#b02a45;
  }
  *{box-sizing:border-box}
  body::before{content:"";display:block;height:6px;background:linear-gradient(90deg,var(--yellow) 0 33.3%,var(--teal) 33.3% 66.6%,var(--pink) 66.6%)}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4}
  header{padding:24px 20px 12px;max-width:820px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
  .missao{flex:1 0 100%;margin:4px 0 0;color:var(--accent);font-size:1.02rem;line-height:1.45;font-weight:500}
  header img{flex:0 0 auto;width:88px;height:88px}
  header>div{flex:1 1 0;min-width:0}
  h1{margin:0 0 4px;font-size:1.6rem}
  .sub{color:var(--muted);margin:0}
  nav{max-width:820px;margin:0 auto;padding:8px 20px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:999px;font-size:.95rem;cursor:pointer}
  nav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  nav label{margin-left:auto;color:var(--muted);font-size:.9rem;display:flex;gap:6px;align-items:center;cursor:pointer}
  main{max-width:820px;margin:0 auto;padding:12px 20px 48px}
  .next{background:var(--accent);color:#fff;border-radius:14px;padding:16px 18px;margin:8px 0 20px}
  .next small{opacity:.85;text-transform:uppercase;letter-spacing:.05em;font-size:.75rem}
  .next .t{font-size:1.15rem;font-weight:600;margin-top:4px}
  .next a{color:#fff}
  h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:24px 0 8px}
  ol{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  li{display:flex;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
  li:first-child{border-top:0}
  .date{flex:0 0 64px;text-align:center}
  .date .d{font-size:1.3rem;font-weight:700;line-height:1}
  .date .w{font-size:.72rem;color:var(--muted);text-transform:uppercase}
  .title{flex:1;min-width:0}
  .title a{color:var(--ink);text-decoration:none;font-weight:600}
  .title a:hover{color:var(--accent);text-decoration:underline}
  .tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;margin-top:3px}
  .open{flex:0 0 auto;font-size:.85rem;color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:8px;padding:6px 10px;white-space:nowrap}
  .open:hover{background:var(--accent-soft)}
  li.reuniao{background:var(--meet)}
  li.reuniao .tag{background:var(--yellow);color:#4d4200}
  li.evento .title{font-weight:600;color:var(--event-ink)}
  li.evento{background:var(--event)}
  li.past{opacity:.45}
  li.is-next{box-shadow:inset 4px 0 0 var(--accent)}
  .escala{display:grid;gap:5px;margin-top:7px}
  .classe{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:.8rem}
  .classe>.nome{flex:0 0 4.7em;font-weight:600;color:var(--muted)}
  .classe>.vazia{color:var(--muted)}
  .slot{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.8rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--muted)}
  .slot b{font-weight:600;color:var(--ink)}
  .slot.cheia{background:var(--accent-soft);border-color:transparent}
  .slot.minha{border-color:var(--accent)}
  button.slot{cursor:pointer;border-style:dashed;border-color:var(--accent);color:var(--accent);background:var(--card)}
  button.slot:hover{background:var(--accent-soft)}
  .slot .sair{font:inherit;border:0;background:none;color:var(--muted);cursor:pointer;padding:0 0 0 2px;line-height:1}
  .slot .sair:hover{color:var(--event-ink)}
  .quem{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 0;color:var(--muted);font-size:.9rem}
  .quem select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);max-width:100%}
  .aviso{margin:8px 0 0;font-size:.9rem;color:var(--event-ink)}
  .conta{max-width:820px;margin:0 auto;padding:4px 20px 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;color:var(--muted);font-size:.9rem}
  .conta[hidden],.conta [hidden]{display:none!important}
  .conta b{color:var(--ink)}
  .conta .ms{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:1px solid #dadce0;border-radius:4px;background:#fff;color:#3c4043;font:500 14px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;cursor:pointer}
  .conta .ms:hover{background:#f7f8f8}
  .conta .link{border:0;background:none;padding:0;font:inherit;color:var(--accent);text-decoration:underline;cursor:pointer}
  #g-btn{min-height:40px}
  .hidden{display:none}
  footer{max-width:820px;margin:0 auto;padding:0 20px 32px;color:var(--muted);font-size:.85rem}
  footer a{color:var(--muted)}
  @media (max-width:520px){ header{padding-top:20px;gap:12px} header img{width:64px;height:64px} h1{font-size:1.35rem} }
  @media (max-width:520px){ .open{padding:6px 8px} .date{flex-basis:48px} li{gap:10px;padding:12px} }
</style>
</head>

// Escalas: ficam guardadas na base de dados da app.iel.pt (várias pessoas por
// classe). Ver e escalar não precisa de login (decisão do Presbitério); quem
// entra com Microsoft ou Google fica logo com o seu nome. Um link de acesso
// (…/#t=<token>) continua a ser aceite, mas não é preciso.
const API = "https://dyibamiqszcnicdaukvg.supabase.co/functions/v1";

const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DIAS = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const hoje = new Date(); hoje.setHours(0,0,0,0);
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };

const anos = [...new Set(LICOES.map(l => l.data.slice(0,4)))];
const proxima = LICOES.find(l => l.tipo !== "reuniao" && parse(l.data) >= hoje);
let anoAtivo = proxima ? proxima.data.slice(0,4) : anos[anos.length-1];
let esconderPassadas = true;

function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function nav(){
  const el = document.getElementById("years");
  el.innerHTML = anos.map(a => `<button data-a="${a}" aria-pressed="${a===anoAtivo}">${a}</button>`).join("")
    + `<label><input type="checkbox" id="pass" ${esconderPassadas?"checked":""}> Esconder datas passadas</label>`;
  el.querySelectorAll("button").forEach(b => b.onclick = () => { anoAtivo = b.dataset.a; render(); });
  el.querySelector("#pass").onchange = e => { esconderPassadas = e.target.checked; render(); };
}

function render(){
  nav();
  quemHtml();
  const n = document.getElementById("next");
  n.innerHTML = proxima ? `<div class="next"><small>Próximo domingo · ${parse(proxima.data).getDate()} de ${MESES[parse(proxima.data).getMonth()].toLowerCase()}</small>
    <div class="t">${proxima.link ? `<a href="${esc(proxima.link)}" target="_blank" rel="noopener">${esc(proxima.titulo)}</a>` : esc(proxima.titulo)}</div></div>` : "";

  const itens = LICOES.filter(l => l.data.startsWith(anoAtivo));
  const porMes = {};
  itens.forEach(l => (porMes[+l.data.slice(5,7)] ??= []).push(l));
  let html = "";
  for (const m of Object.keys(porMes).map(Number).sort((a,b)=>a-b)) {
    const linhas = porMes[m].map(l => {
      const d = parse(l.data), passada = d < hoje;
      if (passada && esconderPassadas) return "";
      const cls = [l.tipo, passada?"past":"", l===proxima?"is-next":""].join(" ");
      const titulo = l.link ? `<a href="${esc(l.link)}" target="_blank" rel="noopener">${esc(l.titulo)}</a>` : esc(l.titulo);
      const tag = l.tipo === "reuniao" ? `<br><span class="tag">Reunião de equipa · para todos</span>` : "";
      const abrir = l.link ? `<a class="open" href="${esc(l.link)}" target="_blank" rel="noopener">Abrir lição</a>` : "";
      return `<li class="${cls}"><div class="date"><div class="d">${d.getDate()}</div><div class="w">${DIAS[d.getDay()]}</div></div>
        <div class="title">${titulo}${tag}${escalaHtml(l, passada)}</div>${abrir}</li>`;
    }).join("");
    if (linhas) html += `<h2>${MESES[m-1]}</h2><ol>${linhas}</ol>`;
  }
  document.getElementById("list").innerHTML = html || `<p class="sub">Não há datas por mostrar.</p>`;
}

// ---- Escalas ---------------------------------------------------------------
let token = null;        // link de acesso da EBD
let escala = null;       // { classes, members, me, can_manage, lessons } vindo do servidor
let eu = null;           // id da pessoa que se está a escalar
let aviso = "";

function lerToken(){
  const t = new URLSearchParams(location.hash.slice(1)).get("t");
  try {
    if (t) {
      sessionStorage.setItem("ebd.token", t);
      history.replaceState(null, "", location.pathname + location.search); // não deixar o link no histórico
    }
    token = t || sessionStorage.getItem("ebd.token");
    eu = localStorage.getItem("ebd.eu");
  } catch { token = t; }
}

async function api(metodo, caminho, corpo){
  const headers = { "Content-Type": "application/json" };
  const ms = await tokenMicrosoft(), g = tokenGoogle();
  if (ms) headers["x-ms-token"] = ms;
  else if (g) headers["x-google-token"] = g;
  else if (token) headers["x-access-token"] = token;
  const r = await fetch(API + "/ebd-signup" + caminho, {
    method: metodo,
    headers,
    body: corpo ? JSON.stringify(corpo) : undefined,
  });
  const dados = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(dados.error || "Não foi possível falar com o servidor."), { status: r.status, pessoal: Boolean(ms || g) });
  return dados;
}

async function carregarEscala(){
  try {
    escala = await api("GET", `?from=${LICOES[0].data}&to=${LICOES[LICOES.length-1].data}`);
    if (escala.me) eu = escala.me;
    if (!escala.members.some(m => m.id === eu)) eu = null;
  } catch (e) {
    escala = null;
    if ((e.status === 401 || e.status === 403) && e.pessoal) {
      // Conta não associada a ninguém, ou sessão expirada: continua sem login.
      aviso = e.status === 403 ? e.message : "A sessão expirou. Entra outra vez.";
      await sairLocal();
      return carregarEscala();
    }
    aviso = e.status === 401 || e.status === 403 ? "Este link de acesso já não é válido. Abre https://ebd.iel.pt sem nada a seguir." : e.message;
  }
  render();
  contaHtml();
}

function quemHtml(){
  const el = document.getElementById("quem");
  if (!escala) { el.innerHTML = aviso ? `<p class="aviso">${esc(aviso)}</p>` : ""; return; }
  const fixo = escala.me && !escala.can_manage;   // sessão pessoal: só se escala a si
  const opcoes = escala.members.map(m => `<option value="${m.id}" ${m.id===eu?"selected":""}>${esc(m.full_name)}</option>`).join("");
  el.innerHTML = `<label class="quem">Estou a escalar:
      <select id="eu" ${fixo?"disabled":""}><option value="">— escolhe o teu nome —</option>${opcoes}</select></label>`
    + (aviso ? `<p class="aviso">${esc(aviso)}</p>` : "");
  el.querySelector("#eu").onchange = e => {
    eu = e.target.value || null; aviso = "";
    try { eu ? localStorage.setItem("ebd.eu", eu) : localStorage.removeItem("ebd.eu"); } catch {}
    render();
  };
}

// As três classes de uma lição: uma linha por classe, com todas as pessoas
// escaladas e o botão para se juntar (várias pessoas por classe).
function escalaHtml(l, passada){
  if (!escala || l.tipo !== "licao") return "";
  const dia = escala.lessons[l.data] || {};
  return `<div class="escala">` + escala.classes.map(c => {
    const pessoas = dia[c.id] || [];
    const nomes = pessoas.map(s => {
      const podeSair = !passada && (s.person_id === eu || escala.can_manage);
      const sair = podeSair ? `<button class="sair" data-acao="sair" data-d="${l.data}" data-c="${c.id}" data-p="${s.person_id}" aria-label="Retirar ${esc(s.name)} da ${esc(c.name)}" title="Retirar">×</button>` : "";
      return `<span class="slot cheia ${s.person_id===eu?"minha":""}"><b>${esc(s.name)}</b>${sair}</span>`;
    }).join("");
    const jaLa = eu && pessoas.some(s => s.person_id === eu);
    const entrar = !passada && !jaLa
      ? `<button class="slot" data-acao="entrar" data-d="${l.data}" data-c="${c.id}" aria-label="Escalar-me na ${esc(c.name)}">+ escalar-me</button>` : "";
    const vazia = !pessoas.length && passada ? `<span class="vazia">—</span>` : "";
    return `<div class="classe"><span class="nome">${esc(c.name)}</span>${nomes}${entrar}${vazia}</div>`;
  }).join("") + `</div>`;
}

document.getElementById("list").addEventListener("click", async e => {
  const b = e.target.closest("button[data-acao]");
  if (!b) return;
  aviso = "";
  if (b.dataset.acao === "entrar" && !eu) {
    aviso = "Escolhe primeiro o teu nome."; render();
    document.getElementById("eu").focus();
    return;
  }
  b.disabled = true;
  try {
    if (b.dataset.acao === "entrar") await api("POST", "", { date: b.dataset.d, class_id: b.dataset.c, person_id: eu });
    else await api("DELETE", `?date=${b.dataset.d}&class=${b.dataset.c}&person=${b.dataset.p}`);
  } catch (err) { aviso = err.message; }
  await carregarEscala();   // mostra sempre o que ficou realmente guardado
});

// ---- Entrar com Microsoft ou Google ----------------------------------------
// Identificadores públicos (não são segredos). O servidor confirma cada token
// junto da Microsoft/Google e reconhece a pessoa pelo email da sua ficha.
const MS_CLIENT_ID = "9ef927b9-2b6f-459e-b003-5aea55470da1";
const MS_TENANT_ID = "807668be-da22-4878-95a4-6c0f996e2c6a";
const GOOGLE_CLIENT_ID = "266316669194-um6nljgok8il1mpc2mjb138jpl0s3nbs.apps.googleusercontent.com";
const ESCOPOS = ["openid", "profile", "email"];

let msApp = null, msConta = null;

async function iniciarMicrosoft(){
  try {
    const { PublicClientApplication } = await import("https://cdn.jsdelivr.net/npm/@azure/msal-browser@5.17.0/+esm");
    msApp = new PublicClientApplication({
      auth: { clientId: MS_CLIENT_ID, authority: `https://login.microsoftonline.com/${MS_TENANT_ID}`, redirectUri: location.origin + location.pathname },
      cache: { cacheLocation: "sessionStorage" },
    });
    await msApp.initialize();
    await msApp.handleRedirectPromise();
    msConta = msApp.getAllAccounts()[0] ?? null;
  } catch (e) {
    msApp = null; msConta = null;
    console.warn("Microsoft:", e);
  }
}

async function tokenMicrosoft(){
  if (!msApp || !msConta) return null;
  try { return (await msApp.acquireTokenSilent({ account: msConta, scopes: ESCOPOS })).idToken || null; }
  catch { return null; }
}

function expira(jwt){
  try { return JSON.parse(atob(jwt.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))).exp * 1000; } catch { return 0; }
}
function tokenGoogle(){
  let t = null;
  try { t = sessionStorage.getItem("ebd.google"); } catch {}
  return t && expira(t) - Date.now() > 60000 ? t : null;
}

function iniciarGoogle(){
  if (!GOOGLE_CLIENT_ID) return Promise.resolve();
  return new Promise(ok => {
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client"; s.async = true;
    s.onerror = () => ok();
    s.onload = () => {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        auto_select: true,
        use_fedcm_for_prompt: true,
        callback: r => {
          try { sessionStorage.setItem("ebd.google", r.credential); localStorage.setItem("ebd.google.usado", "1"); } catch {}
          aviso = ""; carregarEscala();
        },
      });
      google.accounts.id.renderButton(document.getElementById("g-btn"), { theme: "outline", size: "large", text: "signin_with", locale: "pt-PT" });
      let usado = false; try { usado = localStorage.getItem("ebd.google.usado") === "1"; } catch {}
      if (usado && !tokenGoogle() && !msConta) google.accounts.id.prompt();   // renova sem pedir nada
      ok();
    };
    document.head.appendChild(s);
  });
}

async function sairLocal(){
  try { sessionStorage.removeItem("ebd.google"); localStorage.removeItem("ebd.google.usado"); } catch {}
  window.google?.accounts?.id?.disableAutoSelect();
  if (msApp && msConta) {
    // Esquece a conta nesta página sem terminar a sessão Microsoft do browser.
    await msApp.logoutRedirect({ account: msConta, onRedirectNavigate: () => false }).catch(() => {});
    msConta = null;
  }
}

function contaHtml(){
  const conta = document.getElementById("conta");
  const pessoal = Boolean(msConta || tokenGoogle());
  const quem = escala?.signed_in_as;
  conta.hidden = false;
  document.getElementById("c-txt").innerHTML = pessoal && quem
    ? `Entraste como <b>${esc(quem)}</b>` + (escala.me && escala.members.some(m => m.id === escala.me) ? "" : " (não és membro da EBD)") + " ·"
    : "Entra para te escalares com o teu nome:";
  document.getElementById("ms-btn").hidden = pessoal || !msApp;
  document.getElementById("g-btn").hidden = pessoal || !GOOGLE_CLIENT_ID;
  document.getElementById("sair").hidden = !pessoal;
}

document.getElementById("ms-btn").onclick = () => msApp?.loginRedirect({ scopes: ESCOPOS, prompt: "select_account" });
document.getElementById("sair").onclick = async () => {
  await sairLocal();
  eu = null; try { localStorage.removeItem("ebd.eu"); } catch {}
  await carregarEscala();
};

// Colar o link numa página já aberta só muda o "#": tratar como uma abertura nova.
addEventListener("hashchange", () => { if (new URLSearchParams(location.hash.slice(1)).has("t")) { lerToken(); carregarEscala(); } });

lerToken();
render();
(async () => {
  await Promise.all([iniciarMicrosoft(), iniciarGoogle()]);
  await carregarEscala();
})();
