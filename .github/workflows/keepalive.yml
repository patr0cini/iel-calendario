name: keepalive

# Keeps the Supabase free-tier project awake (PROMPT.md section 4). A request to
# the static GitHub Pages site does NOT count as database activity; a real call
# to /health does. This also acts as the sync trigger once Phase 6 lands.
#
# WARNING: GitHub disables scheduled workflows after 60 days without repository
# activity. If nobody commits for two months, both the keep-alive and the sync
# stop at the same time. See README.md.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          curl --fail --silent --show-error --max-time 60 \
            "${{ secrets.SUPABASE_FUNCTIONS_URL }}/health"
